[package]
name = "game_archive"
version = "0.1.0"
edition = "2024"

[lib] # just for the tests
name = "game_archive"

[dependencies]
chrono = "0.4.41"
nix = {version="0.30.1", features=["process", "signal"]}
rocket =  {version="0.5.1", default-features = false, features=["http2", "json"]}
rocket_db_pools = { version = "0.2.0", features = [ "sqlx_sqlite" ]}
sqlx = { version = "0.7.0", features = [ "runtime-tokio", "sqlite" ] }
serde = "1.0.219"
tokio = { version = "1.47.1", features = [ "process" ] }
rust-embed = { version = "8.10.0", features = [ "rocket" ] }
dirs = "6.0.0"
damascus = "0.0.11"
squashfs-async = { version = "0.1.2", features = [ "asyncfs" ] }
fuser-async = "0.1.1"
fuser = { version = "0.11.1" }
image = { version = "0.25.10", default-features = false, features = [ "jpeg", "png", "webp" ]}
png = "0.18.1"
base64 = "0.22.1"
